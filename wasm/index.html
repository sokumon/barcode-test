<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>
<script type="module">
  import { readBarcodesFromImageData } from 'https://esm.run/zxing-wasm@1.3.0/reader';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const resultEl = document.getElementById('result');
  const resultText = document.getElementById('result-text');
  const resultFormat = document.getElementById('result-format');
  const startBtn = document.getElementById('start-btn');
  const statusEl = document.getElementById('status');
  const scanLine = document.getElementById('scan-line');

  let animFrame;
  let lastResult = null;
  let scanning = false;
  let stream = null;

  async function startScanner() {
    try {
      statusEl.textContent = 'Requesting camera...';
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();
      scanning = true;
      startBtn.textContent = 'Stop Scanner';
      startBtn.classList.add('active');
      statusEl.textContent = 'Point at a barcode';
      scanLine.style.display = 'block';
      scanFrame();
    } catch (e) {
      statusEl.textContent = 'Camera error: ' + e.message;
    }
  }

  function stopScanner() {
    scanning = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    startBtn.textContent = 'Start Scanner';
    startBtn.classList.remove('active');
    statusEl.textContent = 'Scanner stopped';
    scanLine.style.display = 'none';
  }

  async function scanFrame() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      try {
        const results = await readBarcodesFromImageData(imageData, {
          tryHarder: false,
          formats: [],
        });
        if (results.length > 0) {
          const r = results[0];
          if (r.text !== lastResult) {
            lastResult = r.text;
            showResult(r.text, r.format);
          }
        }
      } catch (e) {}
    }
    animFrame = requestAnimationFrame(scanFrame);
  }

  function showResult(text, format) {
    resultText.textContent = text;
    resultFormat.textContent = format;
    resultEl.classList.add('visible');
    resultEl.classList.add('pop');
    setTimeout(() => resultEl.classList.remove('pop'), 400);

    // Add to history
    const history = document.getElementById('history');
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span class="h-format">${format}</span><span class="h-text">${text}</span><span class="h-time">${new Date().toLocaleTimeString()}</span>`;
    history.prepend(item);
    if (history.children.length > 8) history.lastChild.remove();
  }

  startBtn.addEventListener('click', () => {
    if (scanning) stopScanner();
    else startScanner();
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    if (lastResult) {
      navigator.clipboard.writeText(lastResult);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    }
  });
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #00ff88;
    --accent2: #ff3e6c;
    --text: #f0f0f0;
    --muted: #555;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  header .badge {
    font-family: var(--mono);
    font-size: 0.6rem;
    background: var(--accent);
    color: #000;
    padding: 2px 7px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .viewport-wrap {
    width: 100%;
    max-width: 640px;
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 16/9;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  canvas { display: none; }

  /* Corner brackets */
  .corner { position: absolute; width: 22px; height: 22px; z-index: 3; }
  .corner.tl { top: 14px; left: 14px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner.tr { top: 14px; right: 14px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .corner.bl { bottom: 14px; left: 14px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner.br { bottom: 14px; right: 14px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  #scan-line {
    display: none;
    position: absolute;
    left: 14px; right: 14px;
    height: 1px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    z-index: 2;
    animation: scanMove 2.2s ease-in-out infinite;
  }

  @keyframes scanMove {
    0%   { top: 18%; opacity: 1; }
    50%  { top: 82%; opacity: 0.7; }
    100% { top: 18%; opacity: 1; }
  }

  .idle-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    pointer-events: none;
  }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  #start-btn {
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 24px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  #start-btn:hover, #start-btn.active {
    background: var(--accent);
    color: #000;
  }

  #status {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* Result card */
  #result {
    width: 100%;
    max-width: 640px;
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 16px 18px;
    display: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.25s, transform 0.25s;
  }

  #result.visible {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  #result.pop {
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0%   { border-left-color: var(--accent2); }
    60%  { border-left-color: var(--accent2); }
    100% { border-left-color: var(--accent); }
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #result-format {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: #1a1a1a;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 2px;
    color: var(--accent);
  }

  #copy-btn {
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  #copy-btn:hover { color: var(--text); border-color: var(--text); }

  #result-text {
    font-family: var(--mono);
    font-size: 0.95rem;
    word-break: break-all;
    color: var(--text);
    line-height: 1.5;
  }

  /* History */
  .section-label {
    width: 100%;
    max-width: 640px;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 28px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  #history {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history-item {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 10px;
    align-items: center;
    font-family: var(--mono);
    font-size: 0.72rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 12px;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .h-format { color: var(--accent); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .h-text { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-time { color: var(--muted); font-size: 0.6rem; text-align: right; }

  /* Powered by */
  .footer {
    margin-top: 36px;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .footer span { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Barcode Scanner</h1>
  <div class="badge">zxing-wasm</div>
</header>

<div class="viewport-wrap">
  <video id="video" muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="scan-line"></div>
  <div class="idle-msg" id="idle-msg">CAMERA INACTIVE</div>
</div>

<div class="controls">
  <button id="start-btn">Start Scanner</button>
  <span id="status">Ready</span>
</div>

<div id="result">
  <div class="result-header">
    <span id="result-format">FORMAT</span>
    <button id="copy-btn">Copy</button>
  </div>
  <div id="result-text"></div>
</div>

<div class="section-label">Scan History</div>
<div id="history"></div>

<div class="footer">Powered by <span>ZXing-C++</span> → WebAssembly → Browser</div>

<script>
  // Hide idle message when video plays
  document.getElementById('video').addEventListener('play', () => {
    document.getElementById('idle-msg').style.display = 'none';
  });
</script>
</body>
</html>
